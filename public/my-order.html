<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>봉주르후르츠 내 주문 확인</title>

<meta property="og:type" content="website" />
<meta property="og:site_name" content="봉주르후르츠" />
<meta property="og:title" content="내 주문 확인 - 봉주르후르츠" />
<meta property="og:description" content="이름을 검색하면 내 예약 내역과 수령 상태를 바로 확인할 수 있어요" />

<style>
:root{
  --board: oklch(27% 0.03 155);
  --frame: oklch(28% 0.04 55);
  --chalk: oklch(93% 0.015 90);
  --chalk-dim: oklch(93% 0.015 90 / 0.55);
  --line: oklch(93% 0.015 90 / 0.22);
  --coral: oklch(62% 0.21 25);
  --blue: oklch(70% 0.11 220);
  --leaf: oklch(70% 0.12 155);
  --amber: oklch(80% 0.13 85);
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--frame);
  font-family:-apple-system,'SF Pro Text','Pretendard','Apple SD Gothic Neo',sans-serif;
  color:var(--chalk);-webkit-tap-highlight-color:transparent;
}
.frame{padding:0;min-height:100vh;}
.board{
  background:var(--board);min-height:100vh;padding:28px 18px 40px;
  max-width:520px;margin:0 auto;
}
.top{text-align:center;padding-bottom:20px;margin-bottom:22px;border-bottom:2px solid var(--line);}
.store{font-size:15px;color:var(--chalk-dim);font-weight:600;margin-bottom:6px;}
.title{font-size:24px;font-weight:800;letter-spacing:-0.01em;}

.search-box{
  background:linear-gradient(135deg, oklch(32% 0.035 155), oklch(28% 0.03 155));
  border:1.5px solid var(--blue);border-radius:18px;padding:18px 16px 16px;
  box-shadow:0 4px 16px rgba(0,0,0,.15);margin-bottom:22px;
}
.search-label{font-size:13px;font-weight:700;margin-bottom:10px;}
.search-box input{
  width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;
  font-size:16px;background:oklch(24% 0.02 155);color:var(--chalk);font-family:inherit;
}
.search-box input::placeholder{color:var(--chalk-dim);}
.search-box input:focus{outline:none;border-color:var(--blue);}
.search-hint{font-size:11.5px;color:var(--chalk-dim);margin-top:8px;line-height:1.5;}

.results{display:flex;flex-direction:column;gap:10px;}
.result-card{
  background:oklch(32% 0.03 155);border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;
}
.result-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
.result-name{font-size:16px;font-weight:800;}
.result-date{font-size:11.5px;color:var(--chalk-dim);white-space:nowrap;}
.result-product{font-size:14px;margin-bottom:4px;}
.result-product b{font-weight:700;}
.status-pill{
  display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px;
  border-radius:20px;margin-top:4px;
}
.status-pill.picked{background:oklch(70% 0.12 155 / .18);color:var(--leaf);}
.status-pill.none{background:oklch(80% 0.13 85 / .18);color:var(--amber);}
.status-pill.noshow{background:oklch(62% 0.21 25 / .18);color:var(--coral);}
.status-pill.postponed{background:oklch(70% 0.11 220 / .18);color:var(--blue);}
.postpone-note{font-size:11.5px;color:var(--blue);margin-top:5px;}
.result-comment{font-size:11.5px;color:var(--amber);margin-top:6px;line-height:1.4;}

.empty{text-align:center;color:var(--chalk-dim);font-size:13.5px;padding:30px 10px;}
.loading{text-align:center;color:var(--chalk-dim);font-size:13px;padding:20px 0;}

.board-link{
  display:block;text-align:center;margin-top:28px;padding-top:18px;border-top:2px solid var(--line);
  color:var(--chalk-dim);font-size:12.5px;text-decoration:none;
}
.board-link b{color:var(--blue);}

@media (max-width:420px){
  .board{padding:22px 14px 32px;}
  .title{font-size:21px;}
}
</style>
</head>
<body>
<div class="frame">
<div class="board">

  <div class="top">
    <div class="store">🍑 봉주르후르츠</div>
    <div class="title">내 주문 확인</div>
  </div>

  <div class="search-box">
    <div class="search-label">🔎 이름으로 검색하세요</div>
    <input id="searchInput" type="text" placeholder="이름으로 검색 (ㄱ, 가, 감, 1561)" autocomplete="off" autofocus />
    <div class="search-hint">이름을 다 안 써도 돼요 — 초성이나 전화번호 뒷자리로도 찾을 수 있어요</div>
  </div>

  <div id="results" class="results"></div>

  <a class="board-link" href="/board">📋 전체 <b>공동구매 게시판</b> 보러가기</a>

</div>
</div>

<script>
const $ = s => document.querySelector(s);

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtMD(dateStr){
  const parts = (dateStr||'').split('-');
  return parts.length===3 ? `${Number(parts[1])}/${Number(parts[2])}` : dateStr;
}

const STATUS_LABEL = { picked:'수령완료', none:'미수령', noshow:'노쇼', postponed:'연기' };

function commentsHtml(comments){
  if(!comments || comments.length===0) return '';
  return `<div class="result-comment">💬 ${comments.map(c=>c.text).join(' · ')}</div>`;
}

function renderResults(results){
  const el = $('#results');
  if(results.length === 0){
    el.innerHTML = '<div class="empty">검색 결과가 없어요<br>이름을 다르게 입력해보세요</div>';
    return;
  }
  el.innerHTML = results.map(r=>{
    const label = STATUS_LABEL[r.status] || r.status;
    let postponeNote = '';
    if(r.status === 'postponed' && r.postponedTo){
      postponeNote = `<div class="postpone-note">🕒 ${fmtMD(r.postponedTo)}로 연기됐어요</div>`;
    } else if(r.fromPostpone){
      postponeNote = `<div class="postpone-note">🕒 ${fmtMD(r.fromPostpone)}에서 연기되어 왔어요</div>`;
    }
    return `
    <div class="result-card">
      <div class="result-head">
        <div class="result-name">${r.name}</div>
        <div class="result-date">${fmtMD(r.date)} 픽업</div>
      </div>
      <div class="result-product"><b>${r.product}</b> ${r.qty}개</div>
      <span class="status-pill ${r.status}">${label}</span>
      ${postponeNote}
      ${commentsHtml(r.comments)}
    </div>`;
  }).join('');
}

let searchTimer = null;
let searchSeq = 0;

async function doSearch(q){
  const el = $('#results');
  if(!q.trim()){ el.innerHTML = ''; return; }
  const mySeq = ++searchSeq;
  el.innerHTML = '<div class="loading">찾는 중...</div>';
  try{
    const res = await fetch('/api/public/my-order?q=' + encodeURIComponent(q) + '&today=' + todayStr());
    if(mySeq !== searchSeq) return;  // 그 사이 새로운 검색이 시작됐으면 이 결과는 버림
    if(!res.ok) throw new Error('검색 실패');
    const data = await res.json();
    renderResults(data.results || []);
  }catch(e){
    if(mySeq !== searchSeq) return;
    el.innerHTML = '<div class="empty">검색 중 문제가 생겼어요<br>잠시 후 다시 시도해주세요</div>';
  }
}

$('#searchInput').addEventListener('input', (e)=>{
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(()=>doSearch(val), 250);
});
</script>
</body>
</html>
